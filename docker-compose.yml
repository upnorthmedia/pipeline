services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
      POSTGRES_DB: content_pipeline
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d content_pipeline"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Dashboard, route handlers and SSE. Starts pipeline runs by publishing onto
  # Redis Streams; it never executes a step, so restarting it leaves an
  # in-flight pipeline alone.
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: deps
    command: pnpm dev
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_URL_SYNC: postgresql://pipeline:pipeline@db:5432/content_pipeline
      REDIS_URL: redis://redis:6379
      RULES_DIR: /app/rules
      MEDIA_DIR: /app/media
      BETTER_AUTH_URL: http://localhost:3000
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public
      - ./web/drizzle:/app/drizzle
      - ./rules:/app/rules
      - mediadata:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Executes the workflow steps. Same `web/src/mastra/index.ts` as the `web`
  # service, reached through the bundle `mastra worker build` produces.
  worker:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: deps
    command: sh -c "pnpm run worker:build && pnpm run worker"
    env_file: .env
    environment:
      DATABASE_URL_SYNC: postgresql://pipeline:pipeline@db:5432/content_pipeline
      REDIS_URL: redis://redis:6379
      # The bundle runs with its own directory as the cwd, so every default
      # path in the app resolves somewhere inside `.mastra/`. All three are
      # required, not conveniences: a missing RULES_DIR silently strips each
      # stage's rule file out of its prompt and a missing TEXTSTAT_DATA_DIR
      # kills the `edit` stage with ENOENT.
      RULES_DIR: /app/rules
      MEDIA_DIR: /app/media
      TEXTSTAT_DATA_DIR: /app/src/mastra/textstat/data
    volumes:
      - ./web/src:/app/src
      - ./rules:/app/rules
      - mediadata:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node /app/src/mastra/scripts/worker-healthcheck.mjs"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  pgdata:
  redisdata:
  mediadata:
